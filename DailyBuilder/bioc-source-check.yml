name: Bioconductor Source Repositories Check

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: "Optional specific repository name to check (leave blank for all recently updated)"
        required: false
        type: string
      hours_back:
        description: "Number of hours to look back for recently updated repositories"
        required: false
        default: "2.0"
        type: string
      branches:
        description: "Comma-separated list of branches to inspect"
        required: false
        default: "devel,RELEASE_3_23"
        type: string

  schedule:
    # Run once an hour at minute 0
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  check_source_repos:
    name: Check Recently Updated Repositories
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Run Bioconductor Source Checker
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BIOC_SOURCE_TOKEN: ${{ secrets.BIOC_SOURCE_TOKEN }}
          BIOC_SOURCE_ORG: ${{ secrets.BIOC_SOURCE_ORG }}
          HOURS_BACK: ${{ github.event.inputs.hours_back || '2.0' }}
          REPO_NAME: ${{ github.event.inputs.repo_name }}
          BRANCHES: ${{ github.event.inputs.branches || 'devel,RELEASE_3_23' }}
        run: |
          python DailyBuilder/check_bioc_source_repos.py \
            ${{ env.REPO_NAME && format('--repo {0}', env.REPO_NAME) || '' }} \
            --hours-back "${{ env.HOURS_BACK }}" \
            --branches "${{ env.BRANCHES }}" \
            --failed-dir "DailyBuilder/FailedChecks"

      - name: Commit and Push Failed Checks Reports
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add DailyBuilder/FailedChecks/
          if git status --porcelain | grep -q "DailyBuilder/FailedChecks/"; then
            git commit -m "Update FailedChecks reports [skip ci]"
            git push
          else
            echo "No changes in FailedChecks directory."
          fi
